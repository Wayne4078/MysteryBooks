<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>미스터리 북스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800&family=Nanum+Myeongjo:wght@800&display=swap">
<style>
/* 책장: 어두운 책상 위에 책 두 권. 책 페이지와 같은 종이·잉크 색 */
:root{--bg:#2B2621;--paper:#F3EAD3;--ink:#1F1A13;--ink2:#463C2E;--accent:#8C2F1C;--desk:#EFE4CC;
 --f-body:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif;--f-disp:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo",serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E0C0A;--paper:#241F18;--ink:#EFE4CC;--ink2:#D3C5A7;--accent:#E8907A;--desk:#EFE4CC}}
:root[data-theme="dark"]{--bg:#0E0C0A;--paper:#241F18;--ink:#EFE4CC;--ink2:#D3C5A7;--accent:#E8907A;--desk:#EFE4CC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--desk);font-family:var(--f-body);font-weight:500;line-height:1.7;word-break:keep-all}
main{max-width:560px;margin:0 auto;padding:40px 16px 56px}
h1{font-family:var(--f-disp);font-weight:800;font-size:40px;line-height:1.2;margin:0 0 6px}
.lead{font-size:17px;font-weight:700;margin:0 0 28px;opacity:.9}
a.book{display:flex;gap:16px;align-items:center;text-decoration:none;color:var(--ink);background:var(--paper);border-radius:2px;padding:14px;margin-bottom:16px;
 box-shadow:0 1px 0 #E3D6B8,0 4px 0 -1px #E3D6B8,0 12px 24px rgba(0,0,0,.35);min-height:120px}
a.book img{width:84px;height:112px;object-fit:cover;border:1.5px solid var(--ink);mix-blend-mode:multiply;flex:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a.book img{mix-blend-mode:normal}}
a.book b{display:block;font-family:var(--f-disp);font-weight:800;font-size:26px;line-height:1.25}
a.book span{display:block;font-size:16px;font-weight:700;color:var(--ink2);margin-top:4px}
a.book i{display:block;font-style:normal;font-size:15px;font-weight:700;color:var(--accent);margin-top:6px}
a.book:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style></head>
<body><main>
<h1>미스터리 북스</h1>
<p class="lead">옛날 게임책을 폰으로. 고르고, 굴리고, 넘기세요.</p>
<a class="book" href="drift/"><img src="drift/art/beach.webp" alt=""><div><b>표류 일기</b><span>은빛 갈매기호 조난자를 위한 모험 책</span><i>1권 · 사흘 · 다시 사는 책</i></div></a>
<a class="book" href="chicken/"><img src="chicken/art/shutter.webp" alt=""><div><b>황금닭 사장님</b><span>퇴직금으로 가게를 연 사람을 위한 모험 책</span><i>1·2장 · 치킨집</i></div></a>
</main></body></html>
